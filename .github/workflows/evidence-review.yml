name: Monthly evidence review

on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # Writes its report to the job summary and fails if any source changed,
      # became unreachable or is a manual source whose review has fallen due.
      # It has no write permission and never changes a registry figure.
      - run: npm run evidence:check
